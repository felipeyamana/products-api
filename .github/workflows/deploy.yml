name: Build and deploy Products API

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  DOTNET_VERSION: 10.0.x
  PROJECT_PATH: src/ProductsApi/ProductsApi.csproj
  SOLUTION_PATH: ProductsApi.sln
  PUBLISH_DIR: ${{ github.workspace }}/publish
  PACKAGE_PATH: ${{ github.workspace }}/products-api.zip

concurrency:
  group: products-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION_PATH }} --configuration Release --no-restore

      - name: Publish
        run: dotnet publish ${{ env.PROJECT_PATH }} --configuration Release --no-build --no-restore --output ${{ env.PUBLISH_DIR }}

      - name: Package app
        run: |
          cd "${{ env.PUBLISH_DIR }}"
          zip -r "${{ env.PACKAGE_PATH }}" .

      - name: Generate EF migration script
        run: |
          dotnet tool install --tool-path ./.tools dotnet-ef --version 10.0.*
          ./.tools/dotnet-ef migrations script --idempotent --no-build \
            --project ${{ env.PROJECT_PATH }} \
            --startup-project ${{ env.PROJECT_PATH }} \
            --configuration Release \
            --output "${{ github.workspace }}/ef-migrations.sql"

      - name: Upload app package
        uses: actions/upload-artifact@v7
        with:
          name: products-api-package
          path: ${{ env.PACKAGE_PATH }}
          if-no-files-found: error

      - name: Upload migration script
        uses: actions/upload-artifact@v7
        with:
          name: products-api-ef-migrations
          path: ${{ github.workspace }}/ef-migrations.sql
          if-no-files-found: error

  deploy:
    name: Deploy to Azure App Service
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: production
      url: https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net

    steps:
      - name: Download app package
        uses: actions/download-artifact@v8
        with:
          name: products-api-package

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy app package
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: products-api.zip

services:
  products-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=ProductsApiDb;User Id=sa;Password=${SQL_SERVER_PASSWORD:-Your_password123};MultipleActiveResultSets=true;TrustServerCertificate=True"
      Database__MigrateOnStartup: true
      Jwt__Audience: products-api
      Jwt__ExpireMinutes: 60
      Jwt__Issuer: products-api
      Jwt__Key: fake-local-docker-jwt-signing-key-please-replace
      Jwt__ApiKey: fake-local-docker-api-key
      Redis__Enabled: true
      Redis__RegisterNullCacheWhenDisabled: false
      Redis__ConnectionString: "redis:6379,abortConnect=False"
      Redis__InstanceName: "products-api:"
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_started

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      SA_PASSWORD: "${SQL_SERVER_PASSWORD:-Your_password123}"
    ports:
      - "1433:1433"
    volumes:
      - products-api-sqlserver:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${SA_PASSWORD}" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - products-api-redis:/data

volumes:
  products-api-sqlserver:
  products-api-redis:
